<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HopKids Publisher — OAuth Callback</title>
  <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;line-height:1.6;color:#222}code{background:#f3f3f3;padding:4px 8px;border-radius:4px;word-break:break-all}</style>
</head>
<body>
  <h1>HopKids Publisher — Authorization Complete</h1>
  <p>Authorization code:</p>
  <p><code id="code">Waiting...</code></p>
  <script>
    const p = new URLSearchParams(location.search);
    document.getElementById("code").textContent = p.get("code") || p.get("error_description") || "No code in URL";
  </script>
</body>
</html>
